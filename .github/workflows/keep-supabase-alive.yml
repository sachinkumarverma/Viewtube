name: Keep Supabase Alive

on:
  schedule:
    # Runs daily at 00:00 UTC to ensure Supabase stays active
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query Supabase Database & Keep Alive
        run: |
          URL="${{ secrets.SUPABASE_URL }}"
          URL="${URL%/}"
          KEY="${{ secrets.SUPABASE_ANON_KEY }}"

          echo "Pinging Supabase PostgreSQL Database..."
          
          # Try querying actual database tables to execute a SELECT query on Postgres
          TABLES=("videos" "reports" "video_view_logs" "users")
          SUCCESS=0

          for TABLE in "${TABLES[@]}"; do
            echo "Attempting DB query on table: '${TABLE}'..."
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "${URL}/rest/v1/${TABLE}?select=*&limit=1" \
              -H "apikey: ${KEY}" \
              -H "Authorization: Bearer ${KEY}")

            if [ "$HTTP_CODE" -eq 200 ]; then
              echo "✅ Success! HTTP 200 OK from table '${TABLE}'. PostgreSQL SELECT query executed."
              SUCCESS=1
              break
            else
              echo "⚠️ Table '${TABLE}' returned HTTP ${HTTP_CODE}."
            fi
          done

          if [ $SUCCESS -eq 0 ]; then
            echo "Fallback: Querying Auth Health endpoint..."
            curl -sfS "${URL}/auth/v1/health" \
              -H "apikey: ${KEY}" \
              -H "Authorization: Bearer ${KEY}"
            echo ""
            echo "Pings completed."
          fi




