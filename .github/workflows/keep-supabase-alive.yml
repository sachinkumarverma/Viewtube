name: Keep Supabase Alive

on:
  schedule:
    # Runs daily at 00:00 UTC to ensure Supabase stays active
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ping Supabase REST API
        run: |
          echo "Pinging Supabase REST API..."
          curl -sfS "${{ secrets.SUPABASE_URL }}/rest/v1/" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" > /dev/null
          echo "Successfully pinged Supabase API!"

      - name: Keepalive Workflow (Prevents GH Actions 60-day auto-disable)
        uses: gautamkrishnar/keepalive-workflow@v2

