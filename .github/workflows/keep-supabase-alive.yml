name: Keep Supabase Alive

on:
  schedule:
    # Runs daily at 00:00 UTC to ensure Supabase stays active
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase API
        run: |
          URL="${{ secrets.SUPABASE_URL }}"
          URL="${URL%/}"
          echo "Pinging Supabase Auth Health Endpoint at ${URL}/auth/v1/health ..."
          curl -sfS "${URL}/auth/v1/health" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
          echo ""
          echo "Successfully pinged Supabase API!"



