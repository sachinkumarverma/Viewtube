name: Keep Supabase Alive

on:
  schedule:
    # Runs daily at 00:00 UTC to ensure Supabase stays active
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query Supabase Database & Keep Alive
        run: |
          URL="${{ secrets.SUPABASE_URL }}"
          URL="${URL%/}"
          
          # Prefer Service Role Key (bypasses RLS), fallback to Anon Key
          KEY="${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}"
          if [ -z "$KEY" ]; then
            echo "ℹ️ SUPABASE_SERVICE_ROLE_KEY not found in secrets, using SUPABASE_ANON_KEY..."
            KEY="${{ secrets.SUPABASE_ANON_KEY }}"
          else
            echo "🔑 Using SUPABASE_SERVICE_ROLE_KEY (guarantees DB query execution past RLS)..."
          fi

          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "❌ ERROR: Missing SUPABASE_URL or API Key in GitHub Repository Secrets!"
            exit 1
          fi

          echo "Pinging Supabase PostgreSQL Database at ${URL}..."
          SUCCESS=0

          # Strategy 1: PostgREST Root Schema Query (queries pg_catalog in PostgreSQL)
          echo "Checking PostgREST Schema Root..."
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "${URL}/rest/v1/" \
            -H "apikey: ${KEY}" \
            -H "Authorization: Bearer ${KEY}")

          if [ "$HTTP_CODE" -eq 200 ]; then
            echo "✅ Strategy 1 Success! HTTP 200 OK from PostgREST Root (pg_catalog query executed)."
            SUCCESS=1
          else
            echo "⚠️ Strategy 1 failed with HTTP ${HTTP_CODE}."
          fi

          # Strategy 2: Query actual tables
          TABLES=("videos" "users" "reports" "video_view_logs")
          for TABLE in "${TABLES[@]}"; do
            echo "Attempting DB query on table '${TABLE}'..."
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "${URL}/rest/v1/${TABLE}?select=*&limit=1" \
              -H "apikey: ${KEY}" \
              -H "Authorization: Bearer ${KEY}" \
              -H "Range-Unit: items")

            if [ "$HTTP_CODE" -eq 200 ] || [ "$HTTP_CODE" -eq 206 ]; then
              echo "✅ Strategy 2 Success! HTTP ${HTTP_CODE} from table '${TABLE}'. PostgreSQL SELECT query executed."
              SUCCESS=1
              break
            else
              echo "⚠️ Table '${TABLE}' returned HTTP ${HTTP_CODE}."
            fi
          done

          if [ $SUCCESS -eq 1 ]; then
            echo "🎉 Supabase PostgreSQL Database successfully queried & kept alive!"
            exit 0
          else
            echo "❌ ERROR: All PostgreSQL database query strategies failed!"
            echo "⚠️ NOTE: Simple '/auth/v1/health' HTTP checks DO NOT count as PostgreSQL activity for Supabase free tier pause prevention."
            echo "Please ensure SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY (or valid SUPABASE_ANON_KEY) are set in GitHub Repository Secrets."
            exit 1
          fi





